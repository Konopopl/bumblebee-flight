[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bumblebee-flight"
version = "0.1.0"
description = "Bumblebee flight dynamics and stabilization with delayed measurements"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "jax>=0.4.35", "matplotlib>=3.8"]

[project.optional-dependencies]
video = ["Pillow>=10", "av>=12"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
bumblebee-flight = "bumblebee_flight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: full nonlinear simulations"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
